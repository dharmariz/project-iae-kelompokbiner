services:
  room-service:
    build: .
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DB_HOST: room_db
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - room_db
    networks:
      - crrs_network
    volumes:
      - .:/var/www

  room_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crrs_room_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - room_db_data:/var/lib/mysql
    networks:
      - crrs_network

networks:
  crrs_network:
    external: true

volumes:
  room_db_data:
