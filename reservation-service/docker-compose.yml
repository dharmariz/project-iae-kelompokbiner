services:
    reservation-service:
        build: .
        ports:
            - "8003:8003"
        env_file:
            - .env
        environment:
            DB_HOST: reservation_db
            RABBITMQ_HOST: rabbitmq
        depends_on:
            - reservation_db
        networks:
            - crrs_network
        volumes:
            - .:/var/www 

    reservation_db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: crrs_reservation_db
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        volumes:
            - reservation_db_data:/var/lib/mysql
        networks:
            - crrs_network

networks:
    crrs_network:
        external: true

volumes:
    reservation_db_data:
