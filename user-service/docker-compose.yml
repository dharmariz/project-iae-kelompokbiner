services:
  user-service:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DB_HOST: user_db
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - user_db
    networks:
      - crrs_network
    volumes:
      - .:/var/www 

  user_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crrs_user_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - user_db_data:/var/lib/mysql
    networks:
      - crrs_network

networks:
  crrs_network:
    external: true

volumes:
  user_db_data:
